{% extends 'base.html' %}

{% block title %}Result — ObjectCounter{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4">Processed Video</h2>
    <div>
      <a href="/" class="btn btn-outline-secondary btn-sm">Home</a>
    </div>
  </div>

  <div class="card p-3">
    <div class="d-flex justify-content-center">
      <div class="video-frame shadow rounded">
        <img id="uploadPreview" src="/upload_feed" alt="Processed video" class="d-block">
      </div>
    </div>
    <div class="mt-3 d-flex justify-content-between align-items-center">
      <div>
        <div class="small-muted">Count</div>
        <div class="h5"><span id="uploadCount">—</span></div>
      </div>
      <div class="small-muted">Close this tab to stop processing</div>
    </div>
  </div>

{% endblock %}
