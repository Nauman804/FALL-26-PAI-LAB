{% extends 'base.html' %}

{% block title %}Live — ObjectCounter{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4">Live Camera</h2>
    <div>
      <a href="/" class="btn btn-outline-secondary btn-sm">Home</a>
    </div>
  </div>

  <div class="card p-3">
    <div class="d-flex justify-content-center">
      <div class="video-frame shadow rounded">
        <img id="liveImg" src="/video_feed" alt="Live feed" class="d-block">
      </div>
    </div>
    <div class="mt-3 d-flex justify-content-between align-items-center">
      <div>
        <div class="small-muted">Count</div>
        <div class="h5"> <span id="liveCount">—</span></div>
      </div>
      <div class="small-muted">Press Ctrl+C in console to stop camera</div>
    </div>
  </div>

{% endblock %}
